<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Базовые задания · Урок 3 · Вежливые фразы — как правильно писать</title>
<style>
:root{
  --jade:#6fd0aa;
  --jade-dark:#3f8f70;
  --paper:#f3e9d2;
  --gold:#d8b571;
  --gold-dark:#b3924f;
  --ink:#3a3226;
  --ink-soft:#8a7d63;
  --red:#a8524a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:28px 16px 56px;
}
main{width:100%;max-width:860px}
.screen{animation:fade .35s ease}
[hidden]{display:none !important}
h1{font-size:2.1rem;margin:.2em 0}
h2{font-size:1.5rem;margin:.2em 0}
.subtitle{color:var(--ink-soft);font-style:italic;margin:.2em 0 1.2em}
.han{font-family:"Noto Serif SC","SimSun","Songti SC","STSong",serif}
.btn{
  font:inherit;
  padding:.55em 1.4em;
  border-radius:10px;
  border:2px solid var(--jade-dark);
  background:#fff;
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
@media (hover:hover){
  .btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(63,143,112,.25)}
}
.btn.primary{background:var(--jade);border-color:var(--jade-dark)}
.btn.gold{background:var(--gold);border-color:var(--gold-dark)}
.btn.small{padding:.3em .9em;font-size:.9rem}
button:focus-visible{outline:3px solid var(--jade-dark);outline-offset:2px}
.hint-toggle{
  display:inline-flex;
  align-items:center;
  gap:.45em;
  color:var(--ink-soft);
  font-style:italic;
  cursor:pointer;
  user-select:none;
  padding:.5em .4em;
}
.hint-toggle input{accent-color:var(--jade-dark);width:1.05em;height:1.05em;cursor:pointer}
#screen-start{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6vh}
#screen-start .han-big{font-size:4.2rem;line-height:1.15;color:var(--jade-dark);margin:.1em 0}
#screen-start .lead{max-width:36em;color:var(--ink-soft)}
#btn-start{font-size:1.25rem;margin-top:1.1em}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;
  margin-top:.8em;
}
.card{
  font:inherit;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.15em;
  padding:16px 8px 12px;
  background:#fff;
  border:2px solid var(--gold);
  border-radius:14px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}
@media (hover:hover){
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(179,146,79,.35);border-color:var(--gold-dark)}
}
.card .han{font-size:2.3rem;line-height:1.15}
.card .py{color:var(--jade-dark);font-style:italic}
.card .ru{color:var(--ink-soft);font-size:.9rem;text-align:center}
.char-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.char-info{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.char-info .han{font-size:2.6rem;line-height:1.1}
.char-info .py{color:var(--jade-dark);font-style:italic;font-size:1.15rem}
.char-info .ru{color:var(--ink-soft)}
.grid-wrap{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
.tzg{
  position:relative;
  width:262px;
  height:262px;
  border:3px solid var(--red);
  border-radius:6px;
  background:
    linear-gradient(to right,transparent calc(50% - 1px),rgba(168,82,74,.30) calc(50% - 1px),rgba(168,82,74,.30) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to bottom,transparent calc(50% - 1px),rgba(168,82,74,.30) calc(50% - 1px),rgba(168,82,74,.30) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(45deg,transparent calc(50% - .7px),rgba(168,82,74,.16) calc(50% - .7px),rgba(168,82,74,.16) calc(50% + .7px),transparent calc(50% + .7px)),
    linear-gradient(-45deg,transparent calc(50% - .7px),rgba(168,82,74,.16) calc(50% - .7px),rgba(168,82,74,.16) calc(50% + .7px),transparent calc(50% + .7px));
}
.tzg .hw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.tzg-label{text-align:center;color:var(--ink-soft);font-size:.9rem;margin-top:6px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.status{text-align:center;min-height:1.6em;color:var(--jade-dark);font-style:italic;margin-bottom:0}
footer{margin-top:3em;text-align:center;color:var(--ink-soft);font-size:.85rem}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen{animation:none}
  .btn,.card{transition:none}
}
@media (max-width:520px){
  body{padding:16px 10px 40px}
  h1{font-size:1.6rem}
  h2{font-size:1.3rem}
  #screen-start{padding-top:1.5vh}
  #screen-start .han-big{font-size:2.8rem}
  #screen-start .lead{font-size:.95rem}
  .cards{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .card .han{font-size:2rem}
  .char-info .han{font-size:2.1rem}
  .char-info .py{font-size:1.05rem}
  .grid-wrap{gap:14px;margin:12px 0 2px}
  .controls{gap:8px}
  .btn{padding:.55em 1.05em}
  .tzg-label{font-size:.85rem}
  footer{margin-top:2em}
}
</style>
</head>
<body>
<main>
  <section id="screen-start" class="screen">
    <p class="subtitle">Базовые задания · Урок 3</p>
    <h1>Вежливые фразы: учимся писать</h1>
    <p class="han-big han">你好 · 谢谢 · 再见</p>
    <p class="lead">5 вежливых фраз китайского: правильный порядок черт, пошаговый показ и тренировка написания от руки в тетрадной клетке.</p>
    <button id="btn-start" class="btn primary" type="button">Начать</button>
  </section>

  <section id="screen-select" class="screen" hidden>
    <h2>Выберите фразу</h2>
    <p class="subtitle">5 фраз</p>
    <div id="cards" class="cards"></div>
  </section>

  <section id="screen-char" class="screen" hidden>
    <div class="char-top">
      <button id="btn-back" class="btn small" type="button">← К выбору</button>
      <div class="char-info">
        <span id="char-han" class="han"></span>
        <span id="char-py" class="py"></span>
        <span id="char-ru" class="ru"></span>
      </div>
    </div>
    <div class="grid-wrap" id="grid"></div>
    <div class="controls">
      <button id="btn-anim" class="btn primary" type="button">Показать анимацию</button>
      <button id="btn-step" class="btn" type="button">По чертам</button>
      <button id="btn-quiz" class="btn gold" type="button">Тренировка</button>
      <label class="hint-toggle" for="chk-nohints"><input type="checkbox" id="chk-nohints"> без подсказок</label>
      <button id="btn-reset" class="btn small" type="button">Сброс</button>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </section>

  <footer>Тетрадь · Урок 3 · база</footer>
</main>
<noscript><p style="text-align:center;padding:20px;">Для работы этой страницы включите JavaScript.</p></noscript>

    drawingWidth: 34,
    strokeAnimationSpeed: 1.1,
    delayBetweenStrokes: 300,
    delayBetweenLoops: 1500,
    charDataLoader: function (chr) { return CHAR_DATA[chr]; }
  };

  var startScreen = document.getElementById('screen-start');
  var selectScreen = document.getElementById('screen-select');
  var charScreen = document.getElementById('screen-char');
  var cardsBox = document.getElementById('cards');
  var statusEl = document.getElementById('status');
  var grid = document.getElementById('grid');

  var writers = [];
  var cur = null;
  var mode = 'idle';
  var stepIdx = 0;
  var stepTotal = 0;
  var quizMistakes = 0;
  var quizNoHints = false;

  function showScreen(node) {
    var all = [startScreen, selectScreen, charScreen];
    for (var i = 0; i < all.length; i++) all[i].hidden = (all[i] !== node);
  }

  function setStatus(text) { statusEl.textContent = text; }

  function strokesOf(chr) { return CHAR_DATA[chr].strokes.length; }

  function strokesLabel(n) {
    var m = n % 10, h = n % 100;
    if (m === 1 && h !== 11) return n + ' черта';
    if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return n + ' черты';
    return n + ' черт';
  }

  function stopAll() {
    for (var i = 0; i < writers.length; i++) {
      var w = writers[i];
      try { w.cancelQuiz(); w.pauseAnimation(); } catch (e) {}
      w.showCharacter({ duration: 0 });
      w.showOutline({ duration: 0 });
    }
  }

  function buildCards() {
    DATA.forEach(function (item) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      var han = document.createElement('span');
      han.className = 'han';
      han.textContent = item.han;
      var py = document.createElement('span');
      py.className = 'py';
      py.textContent = item.py;
      var ru = document.createElement('span');
      ru.className = 'ru';
      ru.textContent = item.note ? item.ru + ' (' + item.note + ')' : item.ru;
      card.appendChild(han);
      card.appendChild(py);
      card.appendChild(ru);
      card.addEventListener('click', function () { openItem(item); });
      cardsBox.appendChild(card);
    });
  }

  function openItem(item) {
    if (typeof HanziWriter === 'undefined') {
      setStatus('Ошибка: Hanzi Writer не загружен.');
      showScreen(charScreen);
      return;
    }
    cur = item;
    mode = 'idle';
    stepIdx = 0;
    quizMistakes = 0;
    for (var c = 0; c < writers.length; c++) {
      try { writers[c].cancelQuiz(); writers[c].pauseAnimation(); } catch (e) {}
    }
    writers = [];
    grid.innerHTML = '';
    var chars = item.han.split('');
    document.getElementById('char-han').textContent = item.han;
    document.getElementById('char-py').textContent = item.py;
    document.getElementById('char-ru').textContent = item.note ? item.ru + ' · ' + item.note : item.ru;
    for (var i = 0; i < chars.length; i++) {
      var cell = document.createElement('div');
      cell.className = 'tzg-cell';
      var tzg = document.createElement('div');
      tzg.className = 'tzg';
      var hw = document.createElement('div');
      hw.className = 'hw';
      tzg.appendChild(hw);
      var lbl = document.createElement('p');
      lbl.className = 'tzg-label';
      lbl.textContent = chars[i] + ' — ' + strokesLabel(strokesOf(chars[i]));
      cell.appendChild(tzg);
      cell.appendChild(lbl);
      grid.appendChild(cell);
      writers.push(HanziWriter.create(hw, chars[i], HW_OPTS));
    }
    setStatus('Выберите режим: анимация, пошаговый показ или тренировка.');
    showScreen(charScreen);
  }

  document.getElementById('btn-start').addEventListener('click', function () {
    showScreen(selectScreen);
  });

  document.getElementById('btn-back').addEventListener('click', function () {
    stopAll();
    mode = 'idle';
    showScreen(selectScreen);
  });

  document.getElementById('btn-anim').addEventListener('click', function () {
    if (!cur) return;
    stopAll();
    mode = 'anim';
    for (var i = 0; i < writers.length; i++) writers[i].loopCharacterAnimation();
    setStatus('Порядок черт повторяется по кругу. «Сброс» — остановить.');
  });

  document.getElementById('btn-step').addEventListener('click', function () {
    if (!cur) return;
    var chars = cur.han.split('');
    if (mode !== 'step' || stepIdx >= stepTotal) {
      stopAll();
      for (var i = 0; i < writers.length; i++) writers[i].hideCharacter({ duration: 0 });
      stepIdx = 0;
      stepTotal = 0;
      for (var j = 0; j < chars.length; j++) stepTotal += strokesOf(chars[j]);
      mode = 'step';
    }
    var w = writers[0];
    var n = stepIdx;
    var acc = 0;
    for (var k = 0; k < chars.length; k++) {
      var len = strokesOf(chars[k]);
      if (stepIdx < acc + len) { w = writers[k]; n = stepIdx - acc; break; }
      acc += len;
    }
    w.animateStroke(n);
    stepIdx += 1;
    if (stepIdx >= stepTotal) setStatus('Черта ' + stepIdx + ' из ' + stepTotal + ' — всё! Ещё раз — сначала.');
    else setStatus('Черта ' + stepIdx + ' из ' + stepTotal + '. Нажимайте «По чертам» дальше.');
  });

  function runQuiz(i) {
    var chars = cur.han.split('');
    if (i >= chars.length) {
      mode = 'idle';
      setStatus('Отлично! «' + cur.han + '» написано полностью. Ошибок: ' + quizMistakes + '.');
      return;
    }
    if (i > 0) setStatus('Знак ' + (i + 1) + ' из ' + chars.length + ' — ' + chars[i] + '.');
    writers[i].hideCharacter({ duration: 0 });
    if (quizNoHints) writers[i].hideOutline({ duration: 0 });
    else writers[i].showOutline({ duration: 0 });
    var opts = {
      onComplete: function (summary) {
        quizMistakes += summary.totalMistakes;
        runQuiz(i + 1);
      }
    };
    if (quizNoHints) opts.showHintAfterMisses = false;
    writers[i].quiz(opts);
  }

  document.getElementById('btn-quiz').addEventListener('click', function () {
    if (!cur) return;
    stopAll();
    mode = 'quiz';
    quizMistakes = 0;
    quizNoHints = document.getElementById('chk-nohints').checked;
    setStatus(quizNoHints
      ? 'Обводите черты по порядку — подсказок не будет.'
      : 'Обводите черты по порядку — мышью или пальцем.');
    runQuiz(0);
  });

  document.getElementById('chk-nohints').addEventListener('change', function () {
    if (mode !== 'quiz' || !cur) return;
    stopAll();
    mode = 'quiz';
    quizMistakes = 0;
    quizNoHints = this.checked;
    setStatus(quizNoHints
      ? 'Тренировка заново — без контура и подсказок.'
      : 'Тренировка заново — с контуром и подсказками.');
    runQuiz(0);
  });

  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!cur) return;
    stopAll();
    mode = 'idle';
    stepIdx = 0;
    setStatus('');
  });

  buildCards();
  showScreen(startScreen);
})();
</script>
