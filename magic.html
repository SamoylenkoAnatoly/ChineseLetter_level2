<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171b34">
  <title>Рыжий оракул — магия имени</title>
  <style>
    :root { color-scheme: dark; font-family: Consolas, "Courier New", monospace; color: #fff0ce; background: #111527; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .stage { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 10px; background: #111527; background-image: linear-gradient(90deg, #ffffff04 1px, transparent 1px), linear-gradient(#ffffff04 1px, transparent 1px); background-size: 20px 20px; }
    .card { position: relative; width: min(100%, 500px); min-height: min(calc(100svh - 20px), 610px); padding: clamp(14px, 4vw, 26px); border: 4px solid #b893bf; background: #252844; background-image: linear-gradient(90deg, #a482bd1a 2px, transparent 2px), linear-gradient(#a482bd1a 2px, transparent 2px), linear-gradient(#302646, #212740 65%, #272239); background-size: 24px 24px, 24px 24px, auto; box-shadow: 0 0 0 4px #111527, 0 0 0 7px #806493, 9px 11px 0 #080d1b, 0 0 26px #a66dc258, inset 0 0 0 4px #4a3b62; text-align: center; }
    .card::before, .card::after { position: absolute; top: 8px; color: #e5b66d; font-size: 16px; content: "✦"; }
    .card::before { left: 12px; }
    .card::after { right: 12px; }
    .eyebrow { display: inline-block; margin: 2px 0 0; padding: 4px 10px; background: #423556; color: #f7cb7f; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 9px 0 2px; color: #ffe3a1; font: 900 clamp(23px, 7vw, 36px)/1.1 Consolas, "Courier New", monospace; letter-spacing: -.055em; text-shadow: 3px 3px #8f4b60, 5px 5px #111527; }
    .subtitle { margin: 8px 0 0; color: #dfd5e7; font-size: 11px; line-height: 1.4; }
    .scene { position: relative; height: clamp(145px, 30svh, 220px); margin: 8px 0; overflow: hidden; border: 3px solid #a680b8; background: #252b4b; box-shadow: inset 0 0 0 3px #171b34, 0 0 0 2px #39304e; }
    .scene::before { position: absolute; inset: 0; content: ""; background: linear-gradient(180deg, #262447 0 50%, #303654 50% 73%, #3d3a53 73% 79%, #292a43 79%); }
    .scene::after { position: absolute; top: 18px; left: 24px; width: 4px; height: 4px; content: ""; background: #ffe3a1; box-shadow: 38px 22px #f4c3d3, 104px -5px #ffe3a1, 192px 20px #ffe3a1, 248px 4px #f4c3d3, 305px 30px #ffe3a1, 353px -2px #ffe3a1, 407px 26px #f4c3d3; }
    .scene svg { position: relative; z-index: 1; display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .ambient-runes, .orb, .orb-sparks, .spell-ring, .spell-rays { transform-box: fill-box; transform-origin: center; }
    .ambient-runes { animation: rune-float 3.2s steps(4, end) infinite alternate; }
    .orb-sparks { animation: idle-sparks 2.4s steps(3, end) infinite alternate; }
    .spell-ring, .spell-rays { opacity: 0; }
    .casting .orb { animation: spell 1.3s steps(4, end) both; }
    .casting .orb-sparks { animation: sparks 1.3s steps(5, end) both; }
    .casting .spell-ring { animation: ring-burst 1.3s steps(6, end) both; }
    .casting .spell-rays { animation: rays-burst 1.3s steps(4, end) both; }
    .casting .scene { animation: flash 1.3s steps(4, end) both; }
    .panel { position: relative; margin: 0 auto; max-width: 390px; padding: 13px; border: 3px solid #c4a880; background: #1b2036; box-shadow: inset 0 0 0 3px #504064, 5px 5px 0 #111527, 0 0 15px #a873bb40; text-align: left; }
    .panel::before, .panel::after { position: absolute; top: -3px; width: 8px; height: 8px; content: ""; border: 2px solid #f6d68f; background: #49375e; }
    .panel::before { left: -3px; }
    .panel::after { right: -3px; }
    .panel-title { margin: 0 0 10px; color: #f7d28a; font-size: 12px; font-weight: 700; }
    .intro { margin: 0 0 13px; color: #eee3d7; font-size: 12px; line-height: 1.5; }
    form { display: grid; gap: 7px; }
    label { color: #f0c988; font-size: 11px; font-weight: 700; }
    input { width: 100%; min-height: 42px; padding: 8px 10px; border: 3px solid #8b83a0; border-radius: 0; outline: none; background: #12182b; color: #fff0ce; font: 13px Consolas, "Courier New", monospace; }
    input::placeholder { color: #b5b1c3; }
    input:focus-visible, button:focus-visible { outline: 3px solid #fff0a7; outline-offset: 3px; }
    button { min-height: 42px; padding: 7px 11px; border: 3px solid #f8d58f; border-radius: 0; cursor: pointer; font: 700 12px Consolas, "Courier New", monospace; }
    button:hover { filter: brightness(1.15); }
    button:active { transform: translate(2px, 2px); box-shadow: none; }
    button:disabled { cursor: wait; }
    .primary { color: #30213b; background: #efb968; box-shadow: 4px 4px 0 #8f5265, 0 0 13px #f7c77780; }
    .secondary { color: #ffe2a3; background: #38324f; box-shadow: 4px 4px 0 #141629; }
    .error { min-height: 15px; margin: 0; color: #ffc5ae; font-size: 11px; line-height: 1.4; }
    .casting-message { margin: 0; color: #f9dfa9; font-size: 13px; line-height: 1.6; text-align: center; }
    .casting-message::after { content: ""; animation: dots 1s steps(4, end) infinite; }
    [hidden], .result[hidden], form[hidden], .intro[hidden], .casting-message[hidden] { display: none !important; }
    .result { display: grid; gap: 9px; }
    .result-caption { margin: 0; color: #f4cb83; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .hero-card { display: grid; grid-template-columns: 90px minmax(0, 1fr); align-items: center; gap: 12px; padding: 7px; border: 2px solid #a27eb1; background: #262a44; box-shadow: inset 0 0 0 2px #554166; }
    .hero-picture { height: 94px; border: 2px solid #d2a478; background: #404264; box-shadow: 0 0 10px #bb83d777; }
    .hero-picture svg { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .name-block { min-width: 0; }
    .hero-label { margin: 0 0 3px; color: #ceabc9; font-size: 10px; }
    .chinese { margin: 0; color: #ffe8ad; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: clamp(25px, 8vw, 35px); font-weight: 700; letter-spacing: .08em; line-height: 1.2; }
    .pinyin { margin: 3px 0 0; color: #e8d3e8; font-size: 13px; line-height: 1.3; }
    .reading { margin: 5px 0 0; color: #eac699; font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }
    .destiny { margin: 0; color: #f5e8d5; font-size: 12px; line-height: 1.5; }
    .destiny strong { color: #f7cf89; }
    .actions { margin-top: 2px; }
    .actions button { width: 100%; }
    .foot { margin: 13px 0 0; color: #c8b6c6; font-size: 10px; line-height: 1.4; }
    .card.has-result .scene { height: clamp(105px, 22svh, 155px); }
    @keyframes rune-float { from { opacity: .45; transform: translateY(3px); } to { opacity: 1; transform: translateY(-4px); } }
    @keyframes idle-sparks { from { opacity: .5; transform: scale(.9); } to { opacity: 1; transform: scale(1.2); } }
    @keyframes spell { 0%, 100% { filter: none; transform: scale(1); } 30%, 65% { filter: brightness(1.8); transform: scale(1.22); } 50% { filter: brightness(2.5); transform: scale(1.4); } }
    @keyframes sparks { 0%, 100% { opacity: 1; transform: scale(1); } 45% { opacity: 1; transform: scale(1.7); } 70% { opacity: .4; transform: scale(2); } }
    @keyframes ring-burst { 0%, 12% { opacity: 0; transform: scale(.4); } 38% { opacity: 1; transform: scale(1); } 75% { opacity: .85; transform: scale(1.7); } 100% { opacity: 0; transform: scale(2); } }
    @keyframes rays-burst { 0%, 25% { opacity: 0; transform: scale(.5); } 45%, 68% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes flash { 0%, 100% { background: #252b4b; } 60% { background: #806995; } }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    @media (max-width: 320px) { .stage { padding: 8px; } .card { padding: 12px; } .panel { padding: 10px; } .hero-card { grid-template-columns: 70px minmax(0, 1fr); gap: 8px; } .hero-picture { height: 77px; } .eyebrow { font-size: 9px; } }
    @media (max-height: 480px) { .card { padding-top: 10px; padding-bottom: 10px; } .scene { height: 125px; } .card.has-result .scene { height: 96px; } .subtitle { margin-top: 4px; } .foot { margin-top: 8px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>

  <script>

      {

        ],

        ],
        rewards: [
          "Кот откроет для тебя новый карман словаря.",

      },
      {

        ],
        practices: [

          ", обсуждая прочитанное с котом-наставником"
        ],
        rewards: [
          "Кот выдаст закладку за внимательное чтение.",
          "Понятная строка откроет кусочек карты, как в игре о потерянном храме.",
          "Шар покажет найденные подсказки, словно детективу в загадочном фильме.",
          "Незнакомое слово перестанет выглядеть как заклинание.",
          "Кот перевернёт страницу, будто открыл дверь в тайную библиотеку.",
          "Твоя догадка о смысле получит кошачью проверку.",
          "В дневнике появится отметка «Загадка текста разгадана».",
          "Кот вручит закладку искателя текстов, почти как карту Индианы Джонса.",
          "Каждая прочитанная строка раскроет следующий фрагмент истории-квеста.",
          "Кот признает, что словарь нужен всё реже."
        ]
      },
      {
        goals: [
          "заказать чай на китайском",
          "попросить дорогу на китайском",
          "представиться новому знакомому на китайском",
          "задать продавцу простой вопрос на китайском"
        ],
        practices: [
          ", заранее проговаривая нужную фразу",
          ", не забывая про вежливое обращение",
          ", сначала репетируя с котом-наставником",
          ", внимательно слушая ответ",
          ", используя выученные слова вместо жестов"
        ],
        rewards: [
          "Кот начислит +1 к смелости говорить.",
          "Верная реплика откроет мирный путь, как в диалоге Mass Effect.",
          "Собеседник поймёт тебя быстрее, чем кот найдёт печенье.",
          "Кот напомнит: ошибаться в разговоре не страшно.",
          "Магический шар отметит разговор как удачно выбранный ответ в RPG.",
          "Даже робкий голос получит пропуск на переговоры с драконом.",
          "Кот вручит значок мастера диалогов, будто после важного квеста.",
          "После разговора ты получишь +1 к уверенности.",
          "Ответ собеседника откроет новую реплику и ещё одно китайское слово.",
          "Кот признает, что твой первый диалог достоин финальных титров."
        ]
      }
    ];
    const missionsPerChapter = 4 * 5 * 10;
    const catColors = [
      { fur: "#e89a52", shadow: "#a95436", muzzle: "#ffe0a7", description: "рыжего" },
      { fur: "#b3a8bd", shadow: "#61566d", muzzle: "#e8d9de", description: "серого" },
      { fur: "#f2d4a2", shadow: "#bd8f69", muzzle: "#fff0d2", description: "кремового" },
      { fur: "#745c69", shadow: "#3d344c", muzzle: "#dfbdb1", description: "тёмного" },
      { fur: "#c78368", shadow: "#824e55", muzzle: "#f1c6aa", description: "карамельного" }
    ];
    const catExpressions = [["surprised", "с удивлёнными глазами"], ["wink", "с хитрым подмигиванием"], ["smug", "с довольной улыбкой"]];
    const catEars = [["pointed", "с острыми ушами"], ["folded", "с загнутыми ушами"]];
    const catAccessories = [["bow", "с бантом"], ["crown", "с короной"], ["scroll", "со свитком"]];
    const catMarkings = ["stripes", "mask", "spot"];
    const card = document.getElementById("card");
    const form = document.getElementById("form");
    const input = document.getElementById("name");
    const error = document.getElementById("error");
    const intro = document.getElementById("intro");
    const castingMessage = document.getElementById("casting-message");
    const result = document.getElementById("result");
    const hero = document.getElementById("hero-picture");
    let casting = false;
    let timer;

    function randomIndex(length) {
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        const limit = Math.floor(4294967296 / length) * length;
        const value = new Uint32Array(1);
        do { window.crypto.getRandomValues(value); } while (value[0] >= limit);
        return value[0] % length;
      }
      return Math.floor(Math.random() * length);
    }

    function reveal(visitor) {
      const surname = surnames[randomIndex(surnames.length)];
      const given = givenNames[randomIndex(givenNames.length)];
      const color = catColors[randomIndex(catColors.length)];
      const expression = catExpressions[randomIndex(catExpressions.length)];
      const ears = catEars[randomIndex(catEars.length)];
      const accessory = catAccessories[randomIndex(catAccessories.length)];
      const markings = catMarkings[randomIndex(catMarkings.length)];
      const missionNumber = randomIndex(missionChapters.length * missionsPerChapter);
      const chapter = missionChapters[Math.floor(missionNumber / missionsPerChapter)];
      const variant = missionNumber % missionsPerChapter;
      const goal = chapter.goals[variant % chapter.goals.length];
      const practice = chapter.practices[Math.floor(variant / chapter.goals.length) % chapter.practices.length];
      const reward = chapter.rewards[Math.floor(variant / (chapter.goals.length * chapter.practices.length))];
      const svg = hero.querySelector("svg");
      svg.querySelectorAll(".fur").forEach(part => part.setAttribute("fill", color.fur));
      svg.querySelectorAll(".fur-shadow").forEach(part => part.setAttribute("fill", color.shadow));
      svg.querySelector(".muzzle").setAttribute("fill", color.muzzle);
      for (const [group, chosen] of [["expression", expression[0]], ["ears", ears[0]], ["accessory", accessory[0]], ["markings", markings]]) {
        svg.querySelectorAll(`.${group}`).forEach(part => { part.hidden = !part.classList.contains(`${group}-${chosen}`); });
      }
      hero.setAttribute("aria-label", `Комичная пиксельная мордочка ${color.description} кота-героя ${ears[1]}, ${expression[1]}, ${accessory[1]}`);
      document.getElementById("greeting").textContent = `${visitor}, кот нашёл твой свиток!`;
      document.getElementById("chinese").textContent = surname[0] + given[0];
      document.getElementById("pinyin").textContent = `${surname[1]} ${given[1]}`;
      document.getElementById("reading").textContent = `Примерно по-русски: ${surname[2]} ${given[2]}`;
      document.getElementById("destiny").textContent = `Твоё предназначение — ${goal}${practice}. ${reward}`;
      card.classList.remove("casting");
      card.classList.add("has-result");
      castingMessage.hidden = true;
      result.hidden = false;
      casting = false;
      document.getElementById("reset").focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (casting) return;
      const visitor = input.value.trim().replace(/\s+/g, " ");
      if (!visitor) {
        input.setAttribute("aria-invalid", "true");
        error.textContent = "Коту нужно знать, как тебя зовут.";
        input.focus();
        return;
      }
      input.removeAttribute("aria-invalid");
      error.textContent = "";
      form.hidden = true;
      intro.hidden = true;
      casting = true;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        reveal(visitor);
      } else {
        castingMessage.hidden = false;
        card.classList.add("casting");
        timer = window.setTimeout(() => reveal(visitor), 1350);
      }
    });
    input.addEventListener("input", () => {
      input.removeAttribute("aria-invalid");
      error.textContent = "";
    });
    document.getElementById("reset").addEventListener("click", () => {
      window.clearTimeout(timer);
      casting = false;
      result.hidden = true;
      card.classList.remove("has-result", "casting");
      form.hidden = false;
      intro.hidden = false;
      input.focus();
    });
  </script>
