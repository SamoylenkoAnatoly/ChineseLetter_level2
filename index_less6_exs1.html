  if(f==='boy'){P(11,3,2,2,d);P(10,1,4,2,'#ffd23f')}

  if(f==='bro'){P(8,4,8,1,d);P(7,5,10,1,d);P(15,5,6,1,d);P(11,4,2,1,a)}
  if(f==='sis'||f==='girlb'){P(9,2,2,2,'#ffd23f');P(13,2,2,2,'#ffd23f');P(11,2,2,2,d)}
  if(f==='kid'){P(4,2,16,1,a);P(11,1,2,2,'#ff5c5c');P(11,3,2,1,d)}
  if(f==='girl'){P(4,8,2,3,a);P(18,8,2,3,a)}
  if(f==='gran'){P(9,13,6,3,W);P(10,16,4,1,W);P(21,15,1,11,'#c98f4a');P(20,14,2,1,'#c98f4a')}
  if(f==='granma'){P(10,1,4,2,W)}
  return B;
}
var tinyCache={};
function tinyGlyph(ch){
  if(tinyCache[ch])return tinyCache[ch];
  var c=document.createElement('canvas');c.width=12;c.height=12;
  var g=c.getContext('2d');
  g.font='12px '+ZH;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#ffe9c9';g.fillText(ch,6,6.5);
  return tinyCache[ch]=c;
}
function smallTf(g,cfg,s){
  if(!cfg.small)return;
  var k=cfg.small;
  g.translate(12*s,28*s);g.scale(k,k);g.translate(-12*s,-28*s);
}
function paintList(g,cfg,list,s){
  g.save();smallTf(g,cfg,s);
  for(var i=0;i<list.length;i++){var t=list[i];g.fillStyle=t.c;g.fillRect(t.x*s,t.y*s,t.w*s,t.h*s)}
  g.restore();
}
function paintChest(g,cfg,ch,s){
  if(!ch)return;
  g.save();g.imageSmoothingEnabled=false;smallTf(g,cfg,s);
  g.drawImage(tinyGlyph(ch),9*s,16.2*s,6*s,4.6*s);
  g.restore();
}
function cutCanvas(ch,half){
  var s=28,t=document.createElement('canvas');t.width=s;t.height=s;
  var tg=t.getContext('2d');
  tg.font='26px '+ZH;tg.textAlign='center';tg.textBaseline='middle';tg.fillStyle='#ffe9c9';
  tg.fillText(ch,s/2,s/2+1);
  var c=document.createElement('canvas');c.width=s;c.height=s;
  var g=c.getContext('2d');
  if(half==='top')g.drawImage(t,0,0,s,s/2,0,0,s,s/2);
  else g.drawImage(t,0,s/2,s,s/2,0,s/2,s,s/2);
  return c;
}

var st={lvl:0,lock:false,parts:[],slots:[],expect:[],zTop:20,album:[]};
var asmTimer=null,drag=null,msgT=null,rzT=null;
var stage,PSZ=function(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--psz'))||62};
function pkey(p){return p.g?('g:'+p.g):('c:'+p.cut+':'+p.half)}
function showScr(id){
  var s=document.querySelectorAll('.scr');
  for(var i=0;i<s.length;i++)s[i].classList.toggle('on',s[i].id===id);
}
function msg(t,c){
  var m=$('#msg');m.textContent=t;m.className=c||'';
  clearTimeout(msgT);
  if(c)msgT=setTimeout(function(){m.textContent='';m.className=''},2100);
}
function miniCanvas(cfg,ch){
  var s=1.6,cv=document.createElement('canvas');
  cv.width=Math.round(24*s);cv.height=Math.round(30*s);
  var g=cv.getContext('2d');
  paintList(g,cfg,robotBlocks(cfg),s);paintChest(g,cfg,ch,s);
  return cv;
}
function fillAlbum(i){
  var a=st.album[i],L=LEVELS[i];
  a.classList.add('got');a.title=L.word;
  a.appendChild(miniCanvas(L.robot,L.build||L.word.charAt(0)));
}
function assembleRobot(cv,cfg,ch,done){
  var s=6,g=cv.getContext('2d');
  cv.width=24*s;cv.height=30*s;
  var blocks=robotBlocks(cfg),idx=[],i,j,tmp;
  for(i=0;i<blocks.length;i++)idx.push(i);
  for(i=idx.length-1;i>0;i--){j=(Math.random()*(i+1))|0;tmp=idx[i];idx[i]=idx[j];idx[j]=tmp}
  var n=0,vis;
  clearInterval(asmTimer);
  asmTimer=setInterval(function(){
    n=Math.min(blocks.length,n+3);
    vis=[];
    for(var k=0;k<n;k++)vis.push(blocks[idx[k]]);
    g.clearRect(0,0,cv.width,cv.height);
    paintList(g,cfg,vis,s);
    if(n%6===0)S.tick();
    if(n>=blocks.length){
      clearInterval(asmTimer);asmTimer=null;
      g.clearRect(0,0,cv.width,cv.height);
      paintList(g,cfg,blocks,s);paintChest(g,cfg,ch,s);
      if(done)done();
    }
  },45);
}
function drawFamily(){
  var cv=$('#famcv'),g=cv.getContext('2d');
  cv.width=528;cv.height=84;g.clearRect(0,0,528,84);
  LEVELS.forEach(function(L,i){
    var x=i*53;
    g.save();g.translate(x+2,3);
    paintList(g,L.robot,robotBlocks(L.robot),2);
    paintChest(g,L.robot,L.build||L.word.charAt(0),2);
    g.restore();
    g.font='11px '+ZH;g.textAlign='center';g.fillStyle='#ffa62b';
    g.fillText(L.word,x+24,79);
  });
}
function scatter(defs){
  var sr=stage.getBoundingClientRect();
  var beltY=sr.height*0.66;
  var zone={x:6,y:beltY+26,w:sr.width-12,h:Math.max(60,sr.height-beltY-34)};
  var n=defs.length,cols=Math.min(4,n),rows=Math.ceil(n/cols);
  var cw=zone.w/cols,chh=zone.h/rows,PS=PSZ();
  defs.forEach(function(p,i){
    var col=i%cols,row=(i/cols)|0;
    var el=document.createElement('div');el.className='part anim';
    if(p.g){
      var sp=document.createElement('span');sp.className='zh';sp.textContent=p.g;el.appendChild(sp);
    }else el.appendChild(cutCanvas(p.cut,p.half));
    var cx=zone.x+col*cw+cw/2+(Math.random()*10-5);
    var cy=zone.y+row*chh+chh/2+(Math.random()*8-4);
    el.style.left=(cx-PS/2)+'px';el.style.top=(cy-PS/2)+'px';
    el._home={x:cx-PS/2,y:cy-PS/2};
    stage.appendChild(el);
    st.parts.push({el:el,def:p,inSlot:null});
  });
}
function loadLevel(i){
  st.lvl=i;st.lock=false;st.parts=[];st.slots=[];st.expect=[];
  clearInterval(asmTimer);asmTimer=null;
  stage.querySelectorAll('.part').forEach(function(e){e.remove()});
  var fb=document.getElementById('fusebox');if(fb)fb.remove();
  var L=LEVELS[i];
  $('#lvl').textContent=(i+1)+'/10';
  $('#goalword').textContent=L.ru;
  $('#ghost').textContent='?';
  var sl=$('#slots');
  sl.innerHTML='';
  sl.classList.toggle('col',L.layout==='v'||L.layout==='cut');
  var vertical=L.layout==='v'||L.layout==='cut';
  for(var k=0;k<2;k++){
    var el=document.createElement('div');el.className='slot';
    if(vertical){
      var tag=document.createElement('span');tag.className='tag';
      tag.textContent=k?'НИЗ':'ВЕРХ';el.appendChild(tag);
    }
    sl.appendChild(el);
    st.slots.push({el:el,part:null});
  }
  var defs=[];
  if(L.layout==='cut'){defs.push({cut:'弟',half:'top'},{cut:'弟',half:'bot'})}
  else L.parts.forEach(function(g){defs.push({g:g})});
  (L.decoys||[]).forEach(function(d){defs.push(typeof d==='string'?{g:d}:d)});
  defs.slice(0,2).forEach(function(p){st.expect.push(pkey(p))});
  showScr('scr-game');
  msg('ПЕРЕТАЩИ ДЕТАЛИ В СЛОТЫ ЧЕРТЕЖА');
  requestAnimationFrame(function(){scatter(defs)});
}
function goHome(rec){rec.el.style.left=rec.el._home.x+'px';rec.el.style.top=rec.el._home.y+'px'}
function snapTo(rec,s){
  var a=s.el.getBoundingClientRect(),b=stage.getBoundingClientRect(),PS=PSZ();
  rec.el.style.left=(a.left-b.left+(a.width-PS)/2)+'px';
  rec.el.style.top=(a.top-b.top+(a.height-PS)/2)+'px';
}
function inSlotArea(s,cx,cy){
  var a=s.el.getBoundingClientRect(),b=stage.getBoundingClientRect();
  return cx>a.left-b.left-6&&cx<a.right-b.left+6&&cy>a.top-b.top-6&&cy<a.bottom-b.top+6;
}
function place(rec,si){
  if(rec.inSlot!=null)st.slots[rec.inSlot].part=null;
  var s=st.slots[si];
  s.part=rec;rec.inSlot=si;
  snapTo(rec,s);
  rec.el.classList.add('set');S.snap();
  var all=true;
  st.slots.forEach(function(x){if(!x.part)all=false});
  if(all)setTimeout(validate,280);
}
function unplace(rec){
  if(rec.inSlot!=null&&st.slots[rec.inSlot])st.slots[rec.inSlot].part=null;
  rec.inSlot=null;rec.el.classList.remove('set');
  goHome(rec);S.back();
}
function validate(){
  if(st.lock)return;
  var all=true;
  st.slots.forEach(function(x){if(!x.part)all=false});
  if(!all)return;
  var got=st.slots.map(function(s){return pkey(s.part.def)}).sort().join('|');
  var exp=st.expect.slice().sort().join('|');
  if(got===exp){
    st.lock=true;
    st.slots.forEach(function(s){s.el.classList.add('ok');s.part.el.classList.add('win')});
    msg('СБОРКА ЗАВЕРШЕНА!','ok');S.fuse();
    setTimeout(fuseShow,650);
  }else{
    S.err();msg('НЕВЕРНАЯ ДЕТАЛЬ! ПРОВЕРЬ ЧЕРТЁЖ','bad');
    st.slots.forEach(function(s){
      if(s.part){s.el.classList.add('shake');s.part.el.classList.add('shake')}
    });
    setTimeout(function(){
      st.slots.forEach(function(s){
        s.el.classList.remove('shake');
        if(s.part){
          var rec=s.part;s.part=null;rec.inSlot=null;
          rec.el.classList.remove('set','shake');
          goHome(rec);
        }
      });
    },440);
  }
}
function fuseShow(){
  var L=LEVELS[st.lvl];
  var fb=document.createElement('div');fb.id='fusebox';fb.textContent=L.word;
  stage.appendChild(fb);
  setTimeout(function(){fb.remove();showRobot()},1050);
}
function showRobot(){
  var L=LEVELS[st.lvl],cfg=L.robot;
  showScr('scr-robot');
  $('#rword').textContent=L.word;
  $('#rpy').textContent=L.py;
  $('#rru').textContent=L.ru;
  $('#rcap').textContent=cfg.cap;
  $('#rcard').classList.remove('on');
  $('#nextBtn').textContent=st.lvl<9?'ДАЛЕЕ ▶':'ФИНАЛ ▶';
  assembleRobot($('#robocv'),cfg,L.build||L.word.charAt(0),function(){
    S.born();
    $('#rcard').classList.add('on');
    fillAlbum(st.lvl);
  });
}
function showEnd(){
  showScr('scr-end');drawFamily();
  var code=$('#code');
  code.classList.remove('go');
  void code.offsetWidth;
  setTimeout(function(){
    code.classList.add('go');
    [450,1000,1550,2100].forEach(function(d){setTimeout(S.dig,d)});
    setTimeout(S.fin,2450);
  },500);
}
function initAlbum(){
  var alb=$('#album');
  for(var i=0;i<10;i++){
    var d=document.createElement('div');d.className='aslot';
    alb.appendChild(d);st.album.push(d);
  }
}
function initDrag(){
  stage.addEventListener('pointerdown',function(e){
    var el=e.target.closest('.part');
    if(!el||st.lock)return;
    e.preventDefault();
    var r=el.getBoundingClientRect();
    drag={el:el,id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,sx:parseFloat(el.style.left),sy:parseFloat(el.style.top),moved:false};
    try{el.setPointerCapture(e.pointerId)}catch(err){}
    el.classList.remove('anim');el.classList.add('drag');
    el.style.zIndex=++st.zTop;
    S.pick();
  });
  stage.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var el=drag.el,sr=stage.getBoundingClientRect(),PS=PSZ();
    var x=e.clientX-sr.left-drag.dx,y=e.clientY-sr.top-drag.dy;
    x=Math.max(-6,Math.min(sr.width-PS+6,x));
    y=Math.max(-6,Math.min(sr.height-PS+6,y));
    if(Math.abs(x-drag.sx)+Math.abs(y-drag.sy)>7)drag.moved=true;
    el.style.left=x+'px';el.style.top=y+'px';
    var cx=x+PS/2,cy=y+PS/2;
    st.slots.forEach(function(s){
      if(!s.part)s.el.classList.toggle('near',inSlotArea(s,cx,cy));
    });
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    var el=drag.el;
    el.classList.remove('drag');el.classList.add('anim');
    st.slots.forEach(function(s){s.el.classList.remove('near')});
    var rec=null;
    st.parts.forEach(function(p){if(p.el===el)rec=p});
    if(rec){
      if(!drag.moved){
        if(rec.inSlot!=null)unplace(rec);
      }else{
        var cx=el.offsetLeft+PSZ()/2,cy=el.offsetTop+PSZ()/2;
        var target=null;
        st.slots.forEach(function(s,si){
          if(!s.part&&inSlotArea(s,cx,cy))target=si;
        });
        if(target!=null)place(rec,target);else{goHome(rec);S.back()}
      }
    }
    drag=null;
  }
  stage.addEventListener('pointerup',end);
  stage.addEventListener('pointercancel',end);
  stage.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function drawStart(){
  var cfg=LEVELS[0].robot,cv=$('#startcv'),g=cv.getContext('2d');
  cv.width=144;cv.height=180;
  g.clearRect(0,0,144,180);
  paintList(g,cfg,robotBlocks(cfg),6);
  paintChest(g,cfg,'爸',6);
}
function init(){
  stage=$('#stage');
  initAlbum();drawStart();initDrag();
  $('#startBtn').onclick=function(){actx();loadLevel(0)};
  $('#nextBtn').onclick=function(){
    if(st.lvl>=9)showEnd();else loadLevel(st.lvl+1);
  };
  $('#againBtn').onclick=function(){
    st.album.forEach(function(a){a.classList.remove('got');a.title='';a.innerHTML=''});
    st.lvl=0;
    showScr('scr-start');
  };
  $('#resetBtn').onclick=function(){
    if(st.lock)return;
    var had=false;
    st.slots.forEach(function(s){
      if(s.part){
        var rec=s.part;s.part=null;rec.inSlot=null;
        rec.el.classList.remove('set');goHome(rec);had=true;
      }
    });
    if(had){S.back();msg('СТОЛ ОЧИЩЕН')}
  };
  $('#sndBtn').onclick=function(){
    muted=!muted;
    this.classList.toggle('off',muted);
    if(!muted)S.pick();
  };
  window.addEventListener('resize',function(){
    clearTimeout(rzT);
    rzT=setTimeout(function(){
      st.parts.forEach(function(p){
        if(p.inSlot!=null&&st.slots[p.inSlot])snapTo(p,st.slots[p.inSlot]);
        else if(p.el._home)goHome(p);
      });
    },140);
  });
  document.addEventListener('pointerdown',function(){actx()},{once:true});
}
init();
})();
</script>
</body>
